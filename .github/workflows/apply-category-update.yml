name: Apply category update
on:
  push:
    branches: [add-coin-categories]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<option>Coins</option><option>Tokens / Exonumia</option><option>Medals</option><option>Commemoratives</option><option>Paper Money</option><option>Sets</option><option>Other</option><option>Folder 1</option><option>Folder 2</option>'
          new='<option>Coins</option><option>Bullion</option><option>Ancients</option><option>Counterfeits</option><option>Error</option><option>Tokens / Exonumia</option><option>Medals</option><option>Commemoratives</option><option>Paper Money</option><option>Sets</option><option>Folder 1</option><option>Folder 2</option>'
          if old not in s:
              raise SystemExit('Expected category list not found; no change made.')
          s=s.replace(old,new,1)
          marker='</script><script data-coin-flag-original-style="1">'
          addon='''</script><script data-folder-category-editor="1">\n(function(){\n  const sel=document.getElementById("category");\n  if(!sel)return;\n  const KEY="lewis-folder-category-names";\n  let names={"Folder 1":"Folder 1","Folder 2":"Folder 2"};\n  try{names={...names,...JSON.parse(localStorage.getItem(KEY)||"{}")} }catch(e){}\n  function refresh(){["Folder 1","Folder 2"].forEach(base=>{const o=[...sel.options].find(x=>x.value===base||x.dataset.folderBase===base);if(o){o.dataset.folderBase=base;o.textContent=names[base]||base;o.value=names[base]||base;}})}\n  function choose(){const o=sel.options[sel.selectedIndex];const base=o&&o.dataset.folderBase;if(!base)return;const current=names[base]||base;const entered=prompt("Enter the name you want for "+base+":",current===base?"":current);if(entered===null){sel.value=current;return}const n=entered.trim();if(!n){alert("Please enter a name for this folder.");sel.value=current;return}names[base]=n;localStorage.setItem(KEY,JSON.stringify(names));refresh();sel.value=n;}\n  [...sel.options].forEach(o=>{if(o.value==="Folder 1"||o.value==="Folder 2")o.dataset.folderBase=o.value;});\n  refresh();\n  sel.addEventListener("change",choose);\n})();\n'''
          if marker not in s:
              raise SystemExit('Expected script marker not found; no change made.')
          s=s.replace(marker,addon+marker,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add coin categories and editable folders"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-category-update.yml || true
          git commit -m "Remove temporary category update workflow" || true
          git push || true
