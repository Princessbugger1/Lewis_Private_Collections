name: Repair Paper Notes layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Paper Notes details into the item form
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          start = s.find('<section id="paperMoneySection"')
          if start < 0:
              raise SystemExit("paperMoneySection not found")
          end = s.find('</section>', start)
          if end < 0:
              raise SystemExit("paperMoneySection end not found")
          end += len('</section>')
          paper = s[start:end]

          paper = paper.replace('<section id="paperMoneySection" class="card">', '<section id="paperMoneySection" class="card wide">', 1)

          s = s[:start] + s[end:]

          marker = '<div id="certSection"'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("certSection not found")
          s = s[:pos] + paper + s[pos:]

          s = s.replace('/* PAPER NOTES FORM FIX v1 */', '')

          p.write_text(s, encoding="utf-8")

      - name: Commit repaired layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Paper Notes form placement"
          git push

      - name: Remove one-time repair workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/repair-paper-notes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-time Paper Notes repair workflow"
          git push
