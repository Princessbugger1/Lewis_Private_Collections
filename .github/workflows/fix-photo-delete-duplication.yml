name: Fix photo delete duplication
on:
  push:
    branches: [photo-delete-duplication-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate photo rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "let row=input.parentElement.querySelector('[data-photo-row=\\\"'+n+'\\\"]');"
          new = "let row=input.closest('[data-photo-row]');"
          if old not in s:
              raise SystemExit('Target line not found; stopping safely.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix duplicate photo delete buttons'
          git push
