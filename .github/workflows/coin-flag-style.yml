name: Apply coin flag style
on:
  push:
    branches: [fix-coin-flag-style]
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact original checkbox style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-coin-flag-original-style="1"'
          if marker not in s:
              script = '''<script data-coin-flag-original-style="1">\n(function(){\n  const defs=[['proofState','Proof'],['commemorativeState','Commemorative']];\n  function apply(b,label){\n    if(!b)return;\n    const v=+(b.dataset.v||0);\n    b.style.width='100%';\n    b.style.minWidth='0';\n    b.classList.remove('yes','no');\n    b.textContent=label+' '+(v===1?'✅':v===2?'❌':'❓');\n    if(v===1)b.classList.add('yes');\n    if(v===2)b.classList.add('no');\n    const labelEl=b.closest('label');\n    if(labelEl){labelEl.childNodes.forEach(n=>{if(n!==b&&n.nodeType===3)n.textContent='';});}\n  }\n  function bind(){\n    defs.forEach(([id,label])=>{\n      const b=document.getElementById(id);\n      if(!b)return;\n      apply(b,label);\n      if(b.dataset.originalStyleBound==='1')return;\n      b.dataset.originalStyleBound='1';\n      b.addEventListener('click',function(e){\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        const v=((+(b.dataset.v||0))+1)%3;\n        b.dataset.v=String(v);\n        apply(b,label);\n      },true);\n    });\n  }\n  bind();\n  setInterval(bind,500);\n})();\n</script>'''
              s=s.replace('</body>', script+'</body>', 1)
          s=s.replace('Variety Check','Variety')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Match Proof and Commemorative to original checkbox style"
          git push
