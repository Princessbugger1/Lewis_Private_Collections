name: Fix Variety label
on:
  push:
    branches: [fix-variety-label]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded label-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'VARIETY LABEL ONLY v2'
          if marker in s:
              print('Already patched; stopping safely.')
              raise SystemExit(0)
          pat = r'Variety check'
          count = len(re.findall(pat, s))
          if count != 3:
              raise SystemExit(f'Refusing to patch: expected exactly 3 occurrences of the visible Variety check wording, found {count}.')
          s = re.sub(pat, 'Variety', s)
          s = s.replace('</script></body></html>', '/* VARIETY LABEL ONLY v2 */</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
          print('Changed all three matching Variety check labels to Variety; behavior untouched.')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Variety check labels to Variety'
          git rm .github/workflows/fix-variety-label.yml
          git commit -m 'Remove temporary variety-label workflow'
          git push
