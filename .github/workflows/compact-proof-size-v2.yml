name: Size Proof and Commemorative to their words

on:
  push:
    branches: [fix-proof-size-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make only Proof and Commemorative controls content-sized
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="b.style.width='100%';b.style.minWidth='0';"
          new="b.style.width='max-content';b.style.minWidth='0';b.style.justifySelf='start';"
          if s.count(old) != 1:
              raise SystemExit(f'Safe stop: expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit the one-line visual fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Size Proof and Commemorative controls to content"
          git push
