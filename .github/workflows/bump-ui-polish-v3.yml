name: Bump UI polish cache v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump UI polish script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('js/catalog-ui-polish.js?v=2','js/catalog-ui-polish.js?v=3')
          s=s.replace('js/catalog-ui-polish.js?v=1','js/catalog-ui-polish.js?v=3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Bump catalog UI polish cache to v3"
            git push
          fi