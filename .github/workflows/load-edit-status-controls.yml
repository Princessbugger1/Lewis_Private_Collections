name: Load edit status controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add script loader and bump UI cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('js/catalog-ui-polish.js?v=3','js/catalog-ui-polish.js?v=5')
          tag='<script src="js/edit-status-controls.js?v=1"></script>'
          if tag not in s:
              s=s.replace('<script src="js/catalog-view-mode.js?v=1"></script>',tag+'<script src="js/catalog-view-mode.js?v=1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Enable edit-only status controls"
            git push
          fi