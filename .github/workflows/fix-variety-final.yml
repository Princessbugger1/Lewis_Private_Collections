name: Finalize Variety label
on:
  push:
    branches: [fix-variety-label]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact guarded label fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='VARIETY LABEL FINAL v1'
          if marker in s:
              raise SystemExit(0)
          old='Varietyed'
          count=s.count(old)
          if count != 3:
              raise SystemExit(f'Refusing to patch: expected exactly 3 Varietyed occurrences, found {count}.')
          s=s.replace(old,'Variety')
          s=s.replace('</script></body></html>','/* VARIETY LABEL FINAL v1 */</script></body></html>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finalize Variety label text'
          git rm .github/workflows/fix-variety-final.yml
          git commit -m 'Remove temporary final Variety workflow'
          git push
