name: Compact Proof and Commemorative controls

on:
  push:
    branches: [fix-proof-commemorative-size]

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact only the Proof and Commemorative controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "b.style.width='100%';\n    b.style.minWidth='0';"
          new = "b.style.width='max-content';\n    b.style.minWidth='0';\n    b.style.justifySelf='start';"
          if s.count(old) != 1:
              raise SystemExit(f'Safe stop: expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit only the intended file change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --exit-code --quiet && exit 0 || true
          git commit -m "Size Proof and Commemorative boxes to their labels"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/compact-proof-commemorative.yml
          git commit -m "Remove temporary workflow"
          git push
