name: Compact Proof and Commemorative controls
on:
  push:
    branches: [compact-proof-commemorative]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded visual-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='PROOF COMMEMORATIVE COMPACT v1'
          if marker in s:
              print('Already patched; stopping safely.')
              raise SystemExit(0)
          old='class="state" style="width:100%" aria-label="Proof status"'
          new='class="state" style="width:auto;min-width:42px" aria-label="Proof status"'
          old2='class="state" style="width:100%" aria-label="Commemorative status"'
          new2='class="state" style="width:auto;min-width:42px" aria-label="Commemorative status"'
          if s.count(old)!=1 or s.count(old2)!=1:
              raise SystemExit(f'Refusing to patch: expected one Proof and one Commemorative control, found {s.count(old)} and {s.count(old2)}.')
          s=s.replace(old,new,1).replace(old2,new2,1)
          s=s.replace('</script></body></html>','/* PROOF COMMEMORATIVE COMPACT v1 */</script></body></html>',1)
          p.write_text(s,encoding='utf-8')
          print('Guarded visual-only patch applied.')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make Proof and Commemorative controls compact'
          git rm .github/workflows/compact-proof-commemorative.yml
          git commit -m 'Remove temporary compact-control workflow'
          git push
