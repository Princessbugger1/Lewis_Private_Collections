name: Refresh catalog asset versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load catalog sections and refresh JavaScript cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = subprocess.check_output(['git','rev-parse','--short=10','HEAD'], text=True).strip()

          # Ensure the Research center loads before the top-level section router.
          research_tag = '<script src="js/catalog-research.js"></script>'
          section_tag = '<script src="js/catalog-sections.js"></script>'
          if 'js/catalog-research.js' not in s:
              if 'js/catalog-sections.js' in s:
                  s = s.replace(section_tag, research_tag + section_tag)
                  if research_tag not in s:
                      s = re.sub(r'(<script\s+src=["\']js/catalog-sections\.js[^"\']*["\']></script>)', research_tag + r'\1', s, count=1)
              else:
                  s = s.replace('</body>', research_tag + section_tag + '</body>')
          if 'js/catalog-sections.js' not in s:
              s = s.replace('</body>', section_tag + '</body>')

          # Give every local JavaScript asset the current catalog revision as its cache key.
          s2 = re.sub(
              r'(<script\s+src=["\']js/[^"\'?]+\.js)(?:\?v=[^"\']*)?(["\'])',
              lambda m: f'{m.group(1)}?v={version}{m.group(2)}',
              s
          )

          if s2 != p.read_text(encoding='utf-8'):
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit refreshed loader and versions if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Refresh catalog browser cache versions"
            git push
          fi