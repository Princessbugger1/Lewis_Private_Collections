name: Refresh catalog asset versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load catalog sections and refresh JavaScript cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = subprocess.check_output(['git','rev-parse','--short=10','HEAD'], text=True).strip()

          # Ensure Research, temporary Google test, and approved-transfer handler load before the section router.
          tags = [
              ('<script src="js/catalog-research.js"></script>', 'js/catalog-research.js'),
              ('<script src="js/catalog-google-test-search.js"></script>', 'js/catalog-google-test-search.js'),
              ('<script src="js/catalog-identification-transfer.js"></script>', 'js/catalog-identification-transfer.js'),
          ]
          section_tag = '<script src="js/catalog-sections.js"></script>'
          for tag, asset in tags:
              if asset not in s:
                  match = re.search(r'<script\s+src=["\']js/catalog-sections\.js[^"\']*["\']></script>', s)
                  if match:
                      s = s[:match.start()] + tag + s[match.start():]
                  else:
                      s = s.replace('</body>', tag + '</body>')
          if 'js/catalog-sections.js' not in s:
              s = s.replace('</body>', section_tag + '</body>')

          # Give every local JavaScript asset the current catalog revision as its cache key.
          s2 = re.sub(
              r'(<script\s+src=["\']js/[^"\'?]+\.js)(?:\?v=[^"\']*)?(["\'])',
              lambda m: f'{m.group(1)}?v={version}{m.group(2)}',
              s
          )

          if s2 != p.read_text(encoding='utf-8'):
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit refreshed loader and versions if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Refresh catalog browser cache versions"
            git push
          fi