name: Refresh catalog asset versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh local JavaScript cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = subprocess.check_output(['git','rev-parse','--short=10','HEAD'], text=True).strip()

          # Every local js/... script gets the current catalog revision as its cache key.
          # This means browsers keep normal caching, but automatically fetch a fresh
          # copy whenever the catalog code is updated on main.
          s2 = re.sub(
              r'(<script\s+src=["\']js/[^"\'?]+\.js)(?:\?v=[^"\']*)?(["\'])',
              lambda m: f'{m.group(1)}?v={version}{m.group(2)}',
              s
          )

          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit refreshed versions if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Refresh catalog browser cache versions"
            git push
          fi