<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Lewis Private Collections</title><style>:root{font-family:system-ui,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}h1{font-size:21px;margin:0}.sub,.small{font-size:11px;opacity:.75}main{max-width:980px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h2{font-size:18px;margin:0 0 12px}.settings-panel{display:none}.settings-panel.open{display:block}.settings-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e5e7eb;padding:9px 0;color:#111827;background:#fff}.settings-row span{color:#111827;font-weight:650}.switch{position:relative;min-width:78px;height:36px;padding:0;border-radius:20px;background:#9ca3af;color:#fff;overflow:hidden}.switch.on{background:#16a34a}.switch .switch-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750}.switch .knob{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.18s}.switch.on .knob{left:46px}.hidden-section{display:none}.display-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.display-bar button{font-size:12px;padding:7px 10px}.display-bar .settings-toggle{background:#e5e7eb;color:#111827}</style></head><body><header><h1>Lewis Private Collections</h1><div class="sub">My Coin Book • master collection catalog</div><div class="display-bar"><button id="phoneMode" class="secondary" type="button">📱 Phone</button><button id="desktopMode" class="secondary" type="button">🖥️ Desktop</button><button id="autoMode" class="secondary" type="button">↔️ Automatic</button><button id="restoreDisplayMode" class="secondary" type="button">↩️ Restore default</button><button id="settingsToggle" class="settings-toggle" type="button">⚙️ Settings</button></div><div id="settingsPanel" class="settings-panel"><div class="card" style="margin:10px 0 0"><h2>Optional Settings</h2><p class="small">Turn optional sections ON or OFF. OFF hides the section or related controls but does not delete saved information.</p><div id="settings"></div></div></div></header><main><section class="card"><h2>Catalog</h2><p>Your collection remains unchanged. Optional settings control display only.</p></section></main><script>const defaults={coa:true,photos:true,paperMoney:true,certification:true,backup:true,ogp:true,originalBox:true,sigma:true,photosComplete:true,variety:true};let settings={...defaults};try{settings={...defaults,...JSON.parse(localStorage.getItem('lewis-settings')||'{}')}}catch(e){}const labels={coa:'COA',photos:'Photos',paperMoney:'Paper Money details',certification:'Certification',backup:'Backup & Restore',ogp:'Original Packaging / OGP',originalBox:'Original Box',sigma:'Sigma Testing',photosComplete:'Photos Complete check',variety:'Variety Check'};function renderSettings(){const box=document.getElementById('settings');box.innerHTML=Object.keys(labels).map(k=>`<div class="settings-row"><span>${labels[k]}</span><button type="button" class="switch ${settings[k]?'on':''}" data-setting="${k}" aria-pressed="${!!settings[k]}"><span class="switch-text">${settings[k]?'ON':'OFF'}</span><span class="knob"></span></button></div>`).join('');box.querySelectorAll('.switch').forEach(btn=>{btn.onclick=()=>{const k=btn.dataset.setting;settings[k]=!settings[k];localStorage.setItem('lewis-settings',JSON.stringify(settings));renderSettings();applySettings()}})}function applySettings(){const map={coa:'coaSection',photos:'photosSection',paperMoney:'paperMoneySection',certification:'certSection',backup:'backupSection'};Object.entries(map).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.classList.toggle('hidden-section',!settings[k])})}document.getElementById('settingsToggle').onclick=()=>document.getElementById('settingsPanel').classList.toggle('open');renderSettings();applySettings();</script></body></html>
