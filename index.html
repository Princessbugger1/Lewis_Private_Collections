<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Lewis Private Collections coin catalog">
  <link rel="manifest" href="manifest.json">
  <title>Lewis Private Collections</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 4px}.sub{opacity:.75;font-size:13px}
    main{max-width:900px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}h2{font-size:18px;margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}label{font-size:12px;font-weight:650;color:#4b5563}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:white}
    button{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.records{display:grid;gap:10px}.record{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.record-title{font-weight:750}.meta{font-size:13px;color:#6b7280;margin-top:3px}.checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.state{background:#f3f4f6;border:1px solid #d1d5db;padding:7px 9px;border-radius:9px;font-size:12px}.state.yes{background:#dcfce7;color:#166534;border-color:#86efac}.state.no{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.state.unknown{background:#f3f4f6;color:#374151}
    .empty{color:#6b7280;text-align:center;padding:18px}.small{font-size:12px;color:#6b7280}
  </style>
</head>
<body>
<header><h1>Lewis Private Collections</h1><div class="sub">My Coin Book • local catalog</div></header>
<main>
  <section class="card">
    <h2>Add a coin</h2>
    <div class="grid">
      <label>Type<input id="type" placeholder="Morgan Dollar"></label>
      <label>Denomination<input id="denom" placeholder="$1"></label>
      <label>Year<input id="year" inputmode="numeric" placeholder="1885"></label>
      <label>Mint<input id="mint" placeholder="CC"></label>
      <label>Grade<input id="grade" placeholder="MS 63"></label>
      <label>Variety<input id="variety" placeholder="VAM / variety"></label>
      <label>Purchase price<input id="purchase" inputmode="decimal" placeholder="$0.00"></label>
      <label>Estimated value<input id="value" inputmode="decimal" placeholder="$0.00"></label>
    </div>
    <div class="actions"><button class="primary" id="add">Add coin</button><button class="secondary" id="clear">Clear</button></div>
    <p class="small">The catalog is stored on this device for now. GitHub is the project source; the next stage can add synced data and photos.</p>
  </section>

  <section class="card">
    <h2>Your coins</h2>
    <div id="records" class="records"></div>
  </section>
</main>
<script>
const KEY='lewis-private-collections-v1';
const fields=['type','denom','year','mint','grade','variety','purchase','value'];
const checks=['COA','OGP','Original box','Sigma tested','Photos complete','Variety checked'];
let coins=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(coins));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const el=document.getElementById('records');if(!coins.length){el.innerHTML='<div class="empty">No coins entered yet.</div>';return}
 el.innerHTML=coins.map((c,i)=>`<div class="record"><div class="record-title">${esc(c.type||'Untitled coin')} ${esc(c.denom||'')}</div><div class="meta">${esc(c.year)} ${esc(c.mint)} • ${esc(c.grade)}${c.variety?' • '+esc(c.variety):''}</div><div class="meta">Purchase: ${esc(c.purchase||'—')} • Value: ${esc(c.value||'—')}</div><div class="checks">${checks.map(k=>{const v=c[k]||0;const cls=v===1?'yes':v===2?'no':'unknown';const txt=v===1?'✅ Yes':v===2?'❌ No':'❓ Unknown / Not Checked';return `<button class="state ${cls}" data-i="${i}" data-k="${esc(k)}">${esc(k)}: ${txt}</button>`}).join('')}</div><div class="actions"><button class="danger" data-del="${i}">Delete</button></div></div>`).join('')}

document.getElementById('add').onclick=()=>{const c={};fields.forEach(f=>c[f]=document.getElementById(f).value.trim());checks.forEach(k=>c[k]=0);coins.unshift(c);save();fields.forEach(f=>document.getElementById(f).value='')};
document.getElementById('clear').onclick=()=>fields.forEach(f=>document.getElementById(f).value='');
document.getElementById('records').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.del!==undefined){coins.splice(Number(b.dataset.del),1);save();return}if(b.dataset.i!==undefined){const i=Number(b.dataset.i),k=b.dataset.k;coins[i][k]=((coins[i][k]||0)+1)%3;save()}};
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
