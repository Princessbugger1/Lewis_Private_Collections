<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Display Test</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:12px}input,select{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:10px;background:#f9fafb;border:1px solid #ddd;border-radius:10px}.record{padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px}.empty{padding:20px;text-align:center;color:#666}@media(max-width:650px){.toolbar{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>Collection Display Test</h1><p>This is a temporary test of the Collection display only. It does not add, edit, or delete coins.</p><div class="stats"><div class="stat"><b id="count">0</b> total items</div><div class="stat"><b id="total">$0</b> estimated value</div></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search your collection"><select id="category"><option value="all">All categories</option></select><select id="composition"><option value="all">All compositions</option></select></div><div id="status"></div><div id="records"></div></div></main><script>const KEY='lewis-private-collections-v8';let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('lewis-private-collections-v7')||'[]')}catch(e){}const $=id=>document.getElementById(id);const money=x=>Number(String(x||'').replace(/[$,]/g,''))||0;function render(){const q=$('search').value.trim().toLowerCase(),c=$('category').value,m=$('composition').value;let list=items.filter(x=>{const text=Object.values(x).join(' ').toLowerCase();return(!q||text.includes(q))&&(c==='all'||x.category===c)&&(m==='all'||x.composition===m)});$('count').textContent=items.length;$('total').textContent='$'+items.reduce((a,x)=>a+money(x.value),0).toLocaleString();$('status').textContent=list.length+' shown • '+items.length+' total';$('records').innerHTML=list.length?list.map(x=>'<div class="record"><b>'+String(x.country||'').replace(/</g,'&lt;')+' • '+String(x.type||'Untitled').replace(/</g,'&lt;')+'</b><br>'+String(x.category||'')+' • '+String(x.year||'')+' • '+String(x.denom||'')+' • '+String(x.mint||'')+' • '+String(x.composition||'')+'<br>Estimated value: $'+money(x.value).toLocaleString()+'</div>').join(''):'<div class="empty">No matching items.</div>'}function fill(){const cs=[...new Set(items.map(x=>x.category).filter(Boolean))].sort(),ms=[...new Set(items.map(x=>x.composition).filter(Boolean))].sort();$('category').innerHTML='<option value="all">All categories</option>'+cs.map(x=>'<option>'+x+'</option>').join('');$('composition').innerHTML='<option value="all">All compositions</option>'+ms.map(x=>'<option>'+x+'</option>').join('')}fill();render();$('search').oninput=render;$('category').onchange=render;$('composition').onchange=render;</script></body></html>
