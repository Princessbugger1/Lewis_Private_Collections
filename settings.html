<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Lewis Private Collections — Settings</title><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h1{font-size:21px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}.small{font-size:12px;color:#6b7280}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid #e5e7eb}.row:first-of-type{border-top:0}.row b{display:block;font-size:14px}button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#111827;color:#fff}.switch{min-width:76px}.on{background:#dcfce7;color:#166534}.off{background:#e5e7eb;color:#374151}.saved{font-size:12px;color:#166534;min-height:18px}</style></head><body><main><section class="card"><h1>Lewis Private Collections</h1><div class="small">Settings • modular feature controls</div></section><section class="card"><h2>Optional catalog features</h2><p class="small">Turn optional fields on or off without deleting your collection records. These controls are a prototype for the main catalog settings system.</p><div id="settings"></div><div class="saved" id="saved"></div></section><section class="card"><button class="primary" onclick="location.href='index.html'">← Back to catalog</button></section></main><script>const key='lewis-private-collections-settings-v1',defs=[['composition','Composition / metal information',true],['weight','Weight and measured weight',true],['metalTest','Metal testing / Sigma information',true],['photos','Photos and photo checklist',true],['research','Research assistance panel',true],['certification','Certification details',true],['help','Help & troubleshooting',true]];let settings={};try{settings=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function render(){document.getElementById('settings').innerHTML=defs.map(([id,label,d])=>{const v=settings[id]??d;return `<div class="row"><div><b>${label}</b><span class="small">${id==='research'?'Research stays inside the catalog context.':id==='photos'?'Camera/photo tools can be added later.':'Optional display feature.'}</span></div><button class="switch ${v?'on':'off'}" data-id="${id}">${v?'ON':'OFF'}</button></div>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;settings[id]=!(settings[id]??true);localStorage.setItem(key,JSON.stringify(settings));document.getElementById('saved').textContent='Saved';render();setTimeout(()=>document.getElementById('saved').textContent='',900)})}render();</script></body></html>
