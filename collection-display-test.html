<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lewis Private Collections — Collection Display Test</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111827}main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}.records{display:grid;gap:9px;margin-top:10px}.record{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.title{font-weight:750;font-size:16px}.meta{font-size:13px;color:#6b7280;margin-top:4px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.stat b{display:block;font-size:18px}.empty{text-align:center;color:#6b7280;padding:20px}button{padding:9px 12px;border:0;border-radius:9px;font-weight:650}</style></head><body><main><section class="card"><h1>Collection Display Test</h1><p>This is a temporary replacement test for the <b>Collection</b> display only. It reads the existing saved collection directly. It does not write, edit, or delete anything.</p></section><section class="card"><div class="stats"><div class="stat"><b id="count">0</b>Total items</div><div class="stat"><b id="value">$0</b>Estimated value</div></div></section><section class="card"><div class="toolbar"><input id="search" placeholder="Search country, type, year, mint, series, composition…"><select id="category"><option value="all">All categories</option></select><select id="composition"><option value="all">All compositions</option></select></div><div id="summary" class="meta"></div><div id="records" class="records"></div></section></main><script>(function(){const KEY='lewis-private-collections-v8',LEGACY='lewis-private-collections-v7';const $=id=>document.getElementById(id);const money=x=>Number(String(x??'').replace(/[$,]/g,''))||0;function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY)||'[]';const a=JSON.parse(raw);return Array.isArray(a)?a:[]}catch(e){return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const items=load();const oldCat=$('category').value,oldComp=$('composition').value;$('category').innerHTML='<option value="all">All categories</option>'+[...new Set(items.map(x=>x.category).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');$('composition').innerHTML='<option value="all">All compositions</option>'+[...new Set(items.map(x=>x.composition).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');if([...$('category').options].some(o=>o.value===oldCat))$('category').value=oldCat;if([...$('composition').options].some(o=>o.value===oldComp))$('composition').value=oldComp;let q=$('search').value.trim().toLowerCase(),cat=$('category').value,comp=$('composition').value;let list=items.filter(x=>{if(q&&!['category','country','type','denom','year','mint','series','grade','variety','composition','collection','location','notes'].some(k=>String(x[k]??'').toLowerCase().includes(q)))return false;if(cat!=='all'&&x.category!==cat)return false;if(comp!=='all'&&x.composition!==comp)return false;return true});$('count').textContent=items.length;$('value').textContent='$'+items.reduce((n,x)=>n+money(x.value),0).toLocaleString();$('summary').textContent=list.length+' shown • '+items.length+' total';$('records').innerHTML=list.length?list.map(x=>'<article class="record"><div class="title">'+esc(x.country||'Country not set')+' • '+esc(x.type||'Untitled')+'</div><div class="meta">'+[x.category,x.year,x.mint,x.denom,x.grade,x.series,x.variety,x.composition].filter(Boolean).map(esc).join(' • ')+' • Qty: '+esc(x.quantity||1)+'</div><div class="meta">Estimated value: $'+money(x.value).toLocaleString()+'</div></article>').join(''):'<div class="empty">'+(items.length?'No matching items yet.':'No saved items found.')+'</div>'}['input','change'].forEach(e=>$('search').addEventListener(e,render));$('category').addEventListener('change',render);$('composition').addEventListener('change',render);window.addEventListener('pageshow',render);window.addEventListener('storage',render);render();setTimeout(render,250);setTimeout(render,1000)})();</script></body></html>
