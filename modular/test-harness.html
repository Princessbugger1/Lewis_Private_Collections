<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modular Fix Test</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}.card{background:#fff;max-width:800px;margin:12px auto;padding:16px;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:10px 0}.switch{min-width:70px;padding:8px;border:0;border-radius:8px;background:#9ca3af;color:#fff;font-weight:700}.on{background:#16a34a}.section{border:1px solid #ddd;padding:12px;margin-top:12px;border-radius:10px}input{max-width:100%;padding:8px}.thumb{max-width:100%;max-height:180px;display:block;margin-top:8px}.hide{display:none}</style></head><body><section class="card"><h1>Modular Fix Test</h1><p>This is a staging test only. It does not modify the live catalog.</p><div id="settings"></div><div id="coaSection" class="section"><b>COA</b><p>COA information belongs here.</p></div><div id="photosSection" class="section"><b>Photos</b><input id="photo" type="file" accept="image/*"><img id="preview" class="thumb" hidden></div><div id="certSection" class="section"><b>Certification</b><p>Service, certification number, and verification link.</p><input placeholder="Verification link"></div></section><script src="settings.js"></script><script src="photos.js"></script><script src="certification.js"></script><script>let s=LewisCatalogSettings.load();const labels={coa:'COA',photos:'Photos',paperMoney:'Paper Money Details',certification:'Certification',ogp:'Original Packaging / OGP',originalBox:'Original Box',sigma:'Sigma Testing',photosComplete:'Photos Complete Check',variety:'Variety Check'};function draw(){document.getElementById('settings').innerHTML=Object.keys(labels).map(k=>`<div class="row"><span>${labels[k]}</span><button class="switch ${s[k]?'on':''}" data-k="${k}">${s[k]?'ON':'OFF'}</button></div>`).join('');LewisCatalogSettings.apply(s)}document.getElementById('settings').onclick=e=>{let b=e.target.closest('[data-k]');if(!b)return;s=LewisCatalogSettings.toggle(s,b.dataset.k);draw()};document.getElementById('photo').onchange=async e=>{let data=await LewisCatalogPhotos.read(e.target.files[0]);LewisCatalogPhotos.preview(document.getElementById('preview'),data);if(data)LewisCatalogPhotos.save([data])};draw();let saved=LewisCatalogPhotos.load()[0];if(saved)LewisCatalogPhotos.preview(document.getElementById('preview'),saved)</script></body></html>
