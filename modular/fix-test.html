<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lewis Collection Fix Test</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}.card{background:#fff;max-width:760px;margin:14px auto;padding:16px;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:10px 0}.sw{min-width:70px;border:0;border-radius:8px;padding:8px;color:#fff;font-weight:700;background:#9ca3af}.sw.on{background:#16a34a}.section{border:1px solid #ddd;padding:12px;margin-top:12px;border-radius:10px}.hide{display:none}.thumb{max-width:100%;max-height:220px;margin-top:10px}input{padding:8px;max-width:100%}</style></head><body><main class="card"><h1>Fix Test</h1><p>This is a safe test page. It does not change your regular catalog.</p><div id="settings"></div><section id="coa" class="section"><b>COA</b><p>COA information stays saved even when this section is hidden.</p></section><section id="photos" class="section"><b>Photos</b><br><input id="file" type="file" accept="image/*"><img id="img" class="thumb" hidden></section><section id="cert" class="section"><b>Certification</b><p>Certification number and verification link.</p><input placeholder="Verification link"></section></main><script>const K='lewis-fix-test-settings';const D={coa:true,photos:true,certification:true,paperMoney:true,ogp:true,originalBox:true,sigma:true,photosComplete:true,variety:true};let s;try{s={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){s={...D}}const L={coa:'COA',photos:'Photos',certification:'Certification',paperMoney:'Paper Money Details',ogp:'Original Packaging / OGP',originalBox:'Original Box',sigma:'Sigma Testing',photosComplete:'Photos Complete Check',variety:'Variety Check'};function apply(){document.getElementById('coa').classList.toggle('hide',s.coa===false);document.getElementById('photos').classList.toggle('hide',s.photos===false);document.getElementById('cert').classList.toggle('hide',s.certification===false)}function draw(){document.getElementById('settings').innerHTML=Object.keys(L).map(k=>'<div class="row"><span>'+L[k]+'</span><button class="sw '+(s[k]?'on':'')+'" data-k="'+k+'">'+(s[k]?'ON':'OFF')+'</button></div>').join('');apply()}document.getElementById('settings').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=!s[b.dataset.k];localStorage.setItem(K,JSON.stringify(s));draw()};document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('img').src=r.result;document.getElementById('img').hidden=false;localStorage.setItem('lewis-fix-test-photo',r.result)};r.readAsDataURL(f)};const p=localStorage.getItem('lewis-fix-test-photo');if(p){document.getElementById('img').src=p;document.getElementById('img').hidden=false}draw()</script></body></html>
