<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lewis Catalog Modular Test</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:12px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:10px 0}button{padding:9px 13px;border:0;border-radius:8px}.on{background:#16a34a;color:white}.off{background:#9ca3af;color:white}section[hidden]{display:none!important}.thumb{max-width:100%;max-height:220px;display:block;margin-top:8px}input{width:100%;box-sizing:border-box;padding:8px}</style></head><body><div class="wrap"><div class="card"><h1>Safe Modular Test</h1><p>This page is on the <b>safe-modular-fixes</b> branch. It cannot change the live catalog.</p></div><div class="card"><h2>Settings</h2><div id="settings"></div></div><section id="coaSection" class="card"><h2>COA</h2><p>COA section is visible.</p></section><section id="photosSection" class="card"><h2>Photos</h2><input id="photo" type="file" accept="image/*"><img id="preview" class="thumb" hidden></section><section id="certSection" class="card"><h2>Certification</h2><input id="cert" placeholder="Certification / verification information"></section><button id="save">Save photo test</button><p id="status"></p></div><script src="settings.js"></script><script src="photos.js"></script><script src="certification.js"></script><script>let settings=LewisCatalogSettings.load();const labels={coa:'COA',photos:'Photos',paperMoney:'Paper Money Details',certification:'Certification',backup:'Backup & Restore',ogp:'Original Packaging / OGP',originalBox:'Original Box',sigma:'Sigma Testing',photosComplete:'Photos Complete Check',variety:'Variety Check'};const el=id=>document.getElementById(id);function draw(){el('settings').innerHTML=Object.keys(labels).map(k=>`<div class="row"><span>${labels[k]}</span><button data-key="${k}" class="${settings[k]?'on':'off'}">${settings[k]?'ON':'OFF'}</button></div>`).join('');LewisCatalogSettings.apply(settings)}el('settings').onclick=e=>{const b=e.target.closest('[data-key]');if(!b)return;settings=LewisCatalogSettings.toggle(settings,b.dataset.key);draw()};el('photo').onchange=async()=>{const data=await LewisCatalogPhotos.read(el('photo').files[0]);LewisCatalogPhotos.preview(el('preview'),data);if(data){LewisCatalogPhotos.save([data]);el('status').textContent='Photo preview loaded.'}};el('save').onclick=()=>{const p=LewisCatalogPhotos.load();LewisCatalogPhotos.preview(el('preview'),p[0]);el('status').textContent=p[0]?'Saved photo restored.':'No photo saved yet.'};draw();</script></body></html>
