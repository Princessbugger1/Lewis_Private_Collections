<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Box Test</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;color:#111827}main{max-width:900px;margin:auto;padding:16px}.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:13px;font-weight:650}input,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;margin-top:4px}button{background:#111827;color:#fff;border:0;font-weight:700;cursor:pointer}.show{background:#166534;margin-top:10px}.item{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:8px}.muted{color:#6b7280}.status{margin-top:8px;font-weight:600}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="box"><h1>New Collection Box Test</h1><p class="muted">This is a temporary replacement-style Collection box. It has its own test storage and does not touch your existing catalog data.</p><div class="grid"><label>Country / issuer<input id="country" placeholder="United States"></label><label>Type / description<input id="type" placeholder="Eisenhower Dollar"></label><label>Year<input id="year" placeholder="1971"></label><label>Estimated value<input id="value" placeholder="10"></label></div><button id="add">Add test coin</button></div><div class="box"><h2>Collection</h2><p><b id="count">0</b> total items &nbsp; <b id="total">$0</b> estimated value</p><button id="show" class="show">SHOW ALL ITEMS</button><div id="status" class="status"></div><div id="list"></div></div></main><script>const KEY='lewis-collection-box-test-v1';let items=[];const $=id=>document.getElementById(id);const money=x=>Number(String(x||'').replace(/[$,]/g,''))||0;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c))}function load(){try{const raw=localStorage.getItem(KEY);items=raw?JSON.parse(raw):[]}catch(e){items=[]}}function render(message=''){load();$('count').textContent=items.length;$('total').textContent='$'+items.reduce((a,x)=>a+money(x.value),0).toLocaleString();$('status').textContent=message||('Loaded '+items.length+' item'+(items.length===1?'':'s'));$('list').innerHTML=items.length?items.map(x=>`<div class="item"><b>${esc(x.country)} • ${esc(x.type)}</b><br>${esc(x.year)} • Estimated value: $${money(x.value).toLocaleString()}</div>`).join(''):'<p class="muted">No items yet.</p>'}function save(){localStorage.setItem(KEY,JSON.stringify(items))}$('add').onclick=()=>{load();const x={country:$('country').value.trim()||'Unknown',type:$('type').value.trim()||'Untitled',year:$('year').value.trim(),value:$('value').value.trim()};items.push(x);save();['country','type','year','value'].forEach(id=>$(id).value='');render('New item added and all items loaded')};$('show').onclick=()=>render('SHOW ALL ITEMS pressed — collection explicitly reloaded');render('Page opened — collection automatically loaded');</script></body></html>
