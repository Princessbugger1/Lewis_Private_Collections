<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Fix Test</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:14px;position:sticky;top:0}.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:650}.card{background:white;margin:12px auto;padding:14px;border-radius:12px;max-width:900px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd;padding:9px 0}.switch{background:#9ca3af;color:white;min-width:68px}.switch.on{background:#16a34a}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}input,select{width:100%;padding:8px;box-sizing:border-box}.photo{border:1px dashed #aaa;padding:8px}.thumb{width:100%;height:130px;object-fit:contain;background:#f8fafc;display:block}.state{background:#f3f4f6}</style></head><body><header><b>Lewis Private Collections — Fix Test</b><div class="bar"><button id="settingsBtn">⚙️ Settings</button><button onclick="location.href='index.html'">Back to catalog</button></div></header><main><section id="settingsPanel" class="card hide"><h2>Optional Settings</h2><p>OFF hides the related section but does not delete saved information.</p><div id="settings"></div></section><section class="card"><h2>Test Item</h2><div class="grid"><label>Type<input id="type" value="Test Coin"></label><label>Year<input id="year" value="2026"></label></div><section id="coa" class="card"><b>Certificate of Authenticity</b><div class="grid"><label>COA status<button id="coaState" class="state">❓</button></label><label>Issuer<input id="coaIssuer"></label><label>Number<input id="coaNumber"></label></div></section><section id="cert" class="card"><h3>Certification</h3><div class="grid"><label>Service<select id="service"><option>PCGS</option><option>NGC</option></select></label><label>Certification number<input id="certNo"></label><label>Verification link<input id="certUrl"></label></div></section><section id="photos" class="card"><b>Photos</b><div class="grid"><div class="photo"><input id="p1" type="file" accept="image/*"><img id="im1" class="thumb" hidden></div><div class="photo"><input id="p2" type="file" accept="image/*"><img id="im2" class="thumb" hidden></div></div></section><button id="save">Save test item</button><p id="status"></p></section></main><script>const KEY='lewis-private-collections-v8',SK='lewis-settings';const $=id=>document.getElementById(id);const defaults={coa:true,photos:true,paperMoney:true,certification:true,backup:true,ogp:true,originalBox:true,sigma:true,photosComplete:true,variety:true};let settings={...defaults};try{settings={...settings,...JSON.parse(localStorage.getItem(SK)||'{}')}}catch(e){}let item=null;try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');item=a.find(x=>x.__fixTest)||null}catch(e){}function apply(){ $('coa').classList.toggle('hide',settings.coa===false);$('photos').classList.toggle('hide',settings.photos===false);$('cert').classList.toggle('hide',settings.certification===false)}function draw(){let labels={coa:'COA',photos:'Photos',paperMoney:'Paper Money details',certification:'Certification',backup:'Backup & Restore',ogp:'Original Packaging / OGP',originalBox:'Original Box',sigma:'Sigma Testing',photosComplete:'Photos Complete check',variety:'Variety Check'};$('settings').innerHTML=Object.keys(labels).map(k=>`<div class="row"><span>${labels[k]}</span><button type="button" class="switch ${settings[k]?'on':''}" data-k="${k}">${settings[k]?'ON':'OFF'}</button></div>`).join('')}function readPhoto(id){let f=$(id).files[0];if(!f)return Promise.resolve(null);return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}$('settingsBtn').onclick=()=>{$('settingsPanel').classList.toggle('hide');draw();apply()};$('settings').onclick=e=>{let b=e.target.closest('[data-k]');if(!b)return;let k=b.dataset.k;settings[k]=!settings[k];localStorage.setItem(SK,JSON.stringify(settings));draw();apply()};$('coaState').onclick=()=>{$('coaState').textContent=$('coaState').textContent==='❓'?'✅':$('coaState').textContent==='✅'?'❌':'❓'};['p1','p2'].forEach((id,i)=>$(id).onchange=()=>{let f=$(id).files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('im'+(i+1)).src=r.result;$('im'+(i+1)).hidden=false};r.readAsDataURL(f)});$('save').onclick=async()=>{try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');item={__fixTest:true,type:$('type').value,year:$('year').value,coa:{issuer:$('coaIssuer').value,number:$('coaNumber').value,status:$('coaState').textContent},certification:{service:$('service').value,number:$('certNo').value,url:$('certUrl').value},photos:[await readPhoto('p1'),await readPhoto('p2')]};let i=a.findIndex(x=>x.__fixTest);if(i>=0)a[i]=item;else a.push(item);localStorage.setItem(KEY,JSON.stringify(a));$('status').textContent='Test item saved. Refresh this page to verify the saved photo.';item.photos.forEach((p,n)=>{if(p){$('im'+(n+1)).src=p;$('im'+(n+1)).hidden=false}})}catch(e){$('status').textContent='Photo save error: '+e.message}};function load(){if(!item)return;let c=item.coa||{},z=item.certification||{};$('type').value=item.type||'';$('year').value=item.year||'';$('coaIssuer').value=c.issuer||'';$('coaNumber').value=c.number||'';$('coaState').textContent=c.status||'❓';$('service').value=z.service||'PCGS';$('certNo').value=z.number||'';$('certUrl').value=z.url||'';(item.photos||[]).forEach((p,i)=>{if(p){$('im'+(i+1)).src=p;$('im'+(i+1)).hidden=false}})}draw();apply();load()</script></body></html>
